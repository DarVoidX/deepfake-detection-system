<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuralTrace — DeepFake Detection</title>
    <meta name="description" content="AI-powered deepfake detection system using ResNeXt50 + LSTM neural architecture.">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- jQuery UI CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.css">
    <!-- NeuralTrace Design System -->
    <link rel="stylesheet" href="/static/css/styles.css">

    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script>
        if (typeof jQuery === 'undefined') {
            document.write('<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"><\/script>');
        }
    </script>

    <!-- Navigation -->
    {% include 'nav-bar.html' %}

    <!-- Main Content -->
    <main class="nt-main">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="nt-footer">
        <div class="nt-footer-inner">
            <div class="nt-footer-left">
                <div class="nt-footer-dot"></div>
                <span class="nt-footer-text">NeuralTrace v1.0 &mdash; ResNeXt50 + LSTM Pipeline Active</span>
            </div>
            <div class="nt-footer-right">
                &copy; {% now 'Y' %} Darshan Naidu
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Active nav link
        document.addEventListener('DOMContentLoaded', function() {
            const path = window.location.pathname;
            document.querySelectorAll('.nt-nav-links a').forEach(link => {
                if (link.getAttribute('href') === path) link.classList.add('active');
            });
        });
    </script>

    {% block js_scripts %}{% endblock %}
    {% block js_cripts %}{% endblock %}
</body>
</html>
